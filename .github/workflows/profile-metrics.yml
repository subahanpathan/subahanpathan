name: Generate Profile Assets

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: subahanpathan
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Capture live project previews
        run: node scripts/capture_projects.js

      - name: Verify generated assets
        run: |
          test -s dist/profile/stats.svg
          test -s dist/profile/languages.svg

          for file in \
            dist/github-contribution-grid-snake.svg \
            dist/github-contribution-grid-snake-dark.svg \
            dist/previews/erp.png \
            dist/previews/subverse.png \
            dist/previews/meter-flow.png \
            dist/previews/bug-tracker.png \
            dist/previews/nexus-ai.png \
            dist/previews/signflow.png
          do
            test -s "$file"
          done

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
